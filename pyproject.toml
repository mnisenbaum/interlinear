[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "interlinear"
version = "0.1.0"
description = "Gera edições interlineares de textos hebraicos e aramaicos como sites estáticos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "pydantic>=2",
    "jinja2",
    "ruamel.yaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
interlinear = "interlinear.cli:app"

[tool.pytest.ini_options]
testpaths = ["testes"]
